[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fortress-kernel"
version = "1.0.0"
description = "Minimal, composable governance kernel with integrity checking, invariant enforcement, and mandate-driven control."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "William King", email = "wking53214@gmail.com" }]
dependencies = ["numpy>=1.24.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/wking53214/fortress-kernel"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
# The kernel is a single top-level module, not a package directory.
# find_packages() found nothing, so `pip install .` produced a wheel with
# no Python files in it (measured 2026-09-07); only the numpy dependency
# was installed and `import fortress_unified` failed from the wheel.
py-modules = ["fortress_unified"]

# NOTE: there is deliberately no [tool.pytest.ini_options] testpaths here.
# It used to say `testpaths = ["tests"]` and there is no tests/ directory:
# the suite is test_fortress_unified.py at the repository root. pytest does
# not fail on that -- it warns once and falls back to searching the working
# directory, or collects nothing and exits 0, depending on version and how
# it was invoked. A CI job would have passed in seconds having run none of
# the 48 tests. Without the setting, pytest searches from the rootdir and
# finds the suite, which is what was happening by accident anyway.

[tool.ruff]
line-length = 100
