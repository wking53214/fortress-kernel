[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fortress-kernel"
version = "1.0.0"
description = "Minimal, composable governance kernel with integrity checking, invariant enforcement, and mandate-driven control."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "William King" }]
dependencies = ["numpy>=1.24.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["fortress_unified"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
