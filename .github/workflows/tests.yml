name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor pyproject.toml claims (requires-python = ">=3.9") is
        # tested, not just asserted. A claimed floor nobody runs is a claim.
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Collected test count is not zero
        # The defect this job exists to make impossible. Until 2026-09-17
        # pyproject.toml set `testpaths = ["tests"]` and there is no tests/
        # directory: pytest collects nothing and exits 0, and a green check
        # for zero tests looks exactly like a green check for all of them.
        # `--collect-only -q` exits 5 on an empty collection, so this step
        # fails before the suite gets a chance to pass vacuously.
        run: python -m pytest --collect-only -q
      - name: Tests
        run: python -m pytest -q
